name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      UNO_TEST_POSTGRES: Host=localhost;Port=5432;Database=uno_test;Username=postgres;Password=uno_ci_only
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: uno_test
          POSTGRES_PASSWORD: uno_ci_only
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/backend/Uno.sln
      - name: Build
        run: dotnet build src/backend/Uno.sln --no-restore
      - name: Prepare isolated progression database
        env:
          PGPASSWORD: uno_ci_only
        run: |
          psql -h localhost -U postgres -d uno_test -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated; create role uno_runtime;"
          for migration in 001_initial_schema 002_social_schema 003_default_cosmetics 004_cosmetic_rewards 006_match_modes 008_session_security 010_email_verification; do
            psql -h localhost -U postgres -d uno_test -v ON_ERROR_STOP=1 -f "database/migrations/$migration.sql"
          done
      - name: Test
        run: dotnet test src/backend/Uno.sln --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web client
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build BrowserHost explicitly
        run: dotnet build tests/Uno.BrowserHost/Uno.BrowserHost.csproj
      - name: Install web dependencies
        working-directory: src/web
        run: npm install
      - name: Install Playwright browser
        working-directory: src/web
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: src/web
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            src/web/playwright-report/
            src/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
